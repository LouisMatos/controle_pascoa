<!DOCTYPE html>
<html lang="pt-BR" th:fragment="layout(pageTitle, content)"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${pageTitle}">Páscoa Gestão</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#198754">
    <meta name="mobile-web-app-capable" content="yes">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- Design tokens -->
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
</head>
<body class="bg-light">

<a class="visually-hidden-focusable skip-link bg-white p-2 m-2 rounded" href="#conteudo">Ir para o conteúdo</a>

<nav class="navbar navbar-expand-lg navbar-dark bg-success py-2" aria-label="Principal">
    <div class="container-fluid px-3">
        <a class="navbar-brand" th:href="@{/dashboard}">
            <i class="bi bi-egg-fill me-1" aria-hidden="true"></i>Páscoa Gestão
        </a>
    </div>
</nav>

<div class="container-fluid" aria-live="polite">
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
        <strong>Sucesso!</strong> <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show mt-3" role="alert">
        <strong>Erro!</strong> <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<main th:replace="${content}"></main>

<footer class="bg-light border-top py-4 mt-5">
    <div class="container-fluid px-3 text-center text-muted small">
        <p>&copy; <span th:text="${#temporals.year(#temporals.createNow())}">2025</span> Páscoa Gestão. Todos os direitos reservados.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
