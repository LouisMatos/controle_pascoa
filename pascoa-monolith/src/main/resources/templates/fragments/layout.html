<!DOCTYPE html>
<html lang="pt-BR" th:fragment="layout(pageTitle, content)"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <!-- M-10 — viewport-fit=cover libera env(safe-area-inset-*) no iPhone com notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <!-- MO-02 — CSRF disponível para forms dinâmicos (modal-confirm) e fetch() JS. -->
    <meta name="_csrf"        th:if="${_csrf != null}" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}"/>
    <title th:replace="${pageTitle}">Sistema Páscoa</title>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e91e63">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Páscoa">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <!-- Bootstrap (mantido para utilitários, dropdowns, modais) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <!-- F-01 — Flatpickr (date/time picker universal, cobre gap do Safari desktop). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css">
    <!-- F-02 — Pickr (color picker universal, cobre gap iOS Safari / Samsung). -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/themes/nano.min.css">
    <!-- FoodFlow Design System v7 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- L-11 — preload + carga paralela do Inter para reduzir FOUT/CLS.
         Antes vinha por @import dentro do typography.css (carga serial). -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/foodflow.css}">

    <!--
        Injeção de white-label do tenant (FASE 2.3).
        No monólito single-tenant, ${tenant} normalmente é null — os valores
        default vêm de tokens.css. Quando o monólito passar a expor o tenant
        atual (futuro), basta popular o atributo "tenant" no GlobalModelAdvice
        e estes valores sobrescrevem os defaults.
    -->
    <!-- W-01 — escapeJavaScript impede que um valor malformado (ex.: "red}body{display:none;/*")
         quebre a folha de estilos. Validação principal é no back-end (TenantColorValidator).
         W-02 — cada CSS var só é emitida quando o tenant tem valor preenchido. Se for null
         ou em branco, NÃO sobrescrevemos a var — assim o default de tokens.css continua valendo
         (em vez de gerar "--brand-primary: ;" que invalida a cascata). -->
    <!-- S-01 — th:nonce permite que o CSP rejeite <style> não autorizados sem
         quebrar o white-label inline. -->
    <style th:if="${tenant != null}" th:nonce="${cspNonce}" th:inline="text">
        :root {
            [(${tenant.corPrimaria      != null and !tenant.corPrimaria.isBlank()      ? '--brand-primary: '      + #strings.escapeJavaScript(tenant.corPrimaria)      + ';' : ''})]
            [(${tenant.corPrimariaDark  != null and !tenant.corPrimariaDark.isBlank()  ? '--brand-primary-dark: ' + #strings.escapeJavaScript(tenant.corPrimariaDark)  + ';' : ''})]
            [(${tenant.corSecundaria    != null and !tenant.corSecundaria.isBlank()    ? '--brand-secondary: '    + #strings.escapeJavaScript(tenant.corSecundaria)    + ';' : ''})]
        }
    </style>
    <link rel="icon" th:if="${tenant != null and tenant.faviconUrl != null}"
                     th:href="@{${tenant.faviconUrl}}">

    <style>
        /* Estilos legados preservados — badges de produto, tabelas, alerts inline */
        .table thead th { background-color: var(--color-slate-50); font-weight: 600; border-bottom: 2px solid var(--color-card-border); }
        .badge-TRUFADO    { background-color: #6f42c1; }
        .badge-RECHEADO   { background-color: #fd7e14; }
        .badge-DIET       { background-color: #0dcaf0; color: #000; }
        .badge-VEGANO     { background-color: #198754; }
        .badge-TRADICIONAL{ background-color: #6c757d; }
        .badge-ESPECIAL   { background-color: #d63384; }
        .estoque-critico  { background-color: #fff3cd !important; }
        .card { border: none; box-shadow: var(--shadow-sm); }
        /* Reset Bootstrap body padding já que .ff-content tem o seu próprio */
        body { font-size: var(--text-body); }
    </style>
</head>
<body>

<a href="#ffContent" class="ff-skip-link">Pular para o conteúdo</a>

<div class="ff-layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div th:replace="~{fragments/sidebar :: sidebar-backdrop}"
         onclick="document.getElementById('ffSidebar').classList.remove('ff-sidebar--open')"></div>

    <!-- Área principal -->
    <div class="ff-main">

        <!-- Topbar -->
        <div th:replace="~{fragments/topbar :: topbar}"></div>

        <!-- Breadcrumb -->
        <div th:replace="~{fragments/breadcrumb :: breadcrumb}"></div>

        <!-- Conteúdo da página -->
        <main id="ffContent" class="ff-content" role="main">

            <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>
            <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
            </div>

            <div th:replace="${content}">Conteúdo da página</div>
        </main>
    </div>
</div>

<!-- Modais e toasts globais (FASE 3) -->
<div th:replace="~{fragments/modal-confirm :: modal}"></div>
<div th:replace="~{fragments/alert :: toasts}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- F-01 — Flatpickr + locale pt-BR + init global. -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/l10n/pt.js"></script>
<script th:src="@{/js/foodflow/flatpickr-init.js}" defer></script>
<!-- F-02 — Pickr color picker + init global. -->
<script src="https://cdn.jsdelivr.net/npm/@simonwep/pickr@1.9.1/dist/pickr.min.js"></script>
<script th:src="@{/js/foodflow/pickr-init.js}" defer></script>
<!-- F-08 — Validação custom (desliga tooltips nativos do browser). -->
<script th:src="@{/js/foodflow/form-validation.js}" defer></script>
<!-- F-09 — File upload estilizado (button + nome do arquivo). -->
<script th:src="@{/js/foodflow/file-upload-init.js}" defer></script>
<!-- F-06 — Proteção global contra duplo submit. -->
<script th:src="@{/js/foodflow/submit-guard.js}" defer></script>
<script th:replace="~{fragments/modal-confirm :: script}"></script>
<script th:inline="javascript">
  // M-09 — registra o SW com `?tenant=<id>` para isolar o cache por tenant.
  // Quando o monólito for multi-tenant (Etapa 13 v6), `tenantId` virá do
  // GlobalModelAdvice; hoje cai em "_default", preservando o comportamento.
  if ('serviceWorker' in navigator) {
    var ffTenantId = /*[[${tenant != null and tenant.id != null} ? ${tenant.id} : '_default']]*/ '_default';
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js?tenant=' + encodeURIComponent(ffTenantId), { scope: '/' })
        .catch(function (err) { console.warn('SW register failed:', err); });
    });
  }
</script>
</body>
</html>
