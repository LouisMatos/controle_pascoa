<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!--
  FoodFlow Empty State Fragment v7

  Uso:
    <div th:replace="~{fragments/empty-state :: empty(
        icon='bi-inbox',
        title='Nenhum pedido encontrado',
        description='Crie seu primeiro pedido para começar.',
        actionLabel='Novo pedido',
        actionHref=@{/pedidos/novo})}">
    </div>

  Versão minimal (sem ação):
    <div th:replace="~{fragments/empty-state :: empty(
        icon='bi-bell-slash', title='Sem alertas', description='')}">
    </div>
-->

<div th:fragment="empty(icon, title, description, actionLabel, actionHref)"
     class="ff-empty-state text-center"
     style="padding: var(--space-12) var(--space-4); color: var(--color-text-secondary);">
    <i th:class="'bi ' + ${icon != null ? icon : 'bi-inbox'}"
       style="font-size: 3rem; opacity: 0.4; display: block; margin-bottom: var(--space-3);"></i>
    <h3 class="ff-heading-3" style="color: var(--color-text-primary); margin-bottom: var(--space-2);"
        th:text="${title != null ? title : 'Nada por aqui'}">Nada por aqui</h3>
    <p th:if="${description != null and !#strings.isEmpty(description)}"
       th:text="${description}"
       style="margin-bottom: var(--space-5); max-width: 420px; margin-left: auto; margin-right: auto;"></p>
    <a th:if="${actionLabel != null and actionHref != null}"
       th:href="${actionHref}"
       class="ff-btn ff-btn--primary">
        <i class="bi bi-plus-lg"></i>
        <span th:text="${actionLabel}">Ação</span>
    </a>
</div>

</body>
</html>
