<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!--
  Topbar FoodFlow v7 — hambúrguer (mobile), busca, sino de alertas,
  menu do usuário. Reaproveita o controller existente /alertas e os
  atributos globais (alertasRecentes, alertasNaoLidos) do GlobalModelAdvice.
-->
<header th:fragment="topbar" class="ff-topbar" role="banner">

    <!-- Hambúrguer (só aparece no mobile via CSS) -->
    <button type="button"
            class="ff-topbar__hamburger"
            aria-label="Abrir menu"
            onclick="document.getElementById('ffSidebar').classList.toggle('ff-sidebar--open')">
        <i class="bi bi-list"></i>
    </button>

    <!-- Busca global (placeholder — endpoint real fica para Fase 4) -->
    <div class="ff-topbar__search" role="search">
        <label class="ff-sr-only" for="ffGlobalSearch">Busca global no sistema</label>
        <i class="bi bi-search ff-topbar__search-icon" aria-hidden="true"></i>
        <input type="search" id="ffGlobalSearch"
               placeholder="Buscar pedidos, clientes, produtos..."
               aria-label="Busca global"
               aria-describedby="ffGlobalSearchHint"
               disabled
               title="Busca global será habilitada na Fase 4">
        <span id="ffGlobalSearchHint" class="ff-sr-only">A busca será habilitada em breve.</span>
    </div>

    <div class="ff-topbar__actions">

        <!-- Sino de alertas -->
        <div class="dropdown" sec:authorize="isAuthenticated()">
            <button type="button"
                    class="ff-topbar__action"
                    data-bs-toggle="dropdown"
                    aria-expanded="false"
                    aria-label="Alertas internos">
                <i class="bi bi-bell" style="font-size: 1.15rem;"></i>
                <span th:if="${alertasNaoLidos != null and alertasNaoLidos > 0}"
                      class="ff-topbar__badge"
                      th:text="${alertasNaoLidos > 99} ? '99+' : ${alertasNaoLidos}"></span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow"
                style="width:340px; max-height:420px; overflow-y:auto;">
                <li>
                    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
                        <span class="fw-semibold small">Alertas</span>
                        <a th:href="@{/alertas}" class="small text-muted text-decoration-none">Ver todos</a>
                    </div>
                </li>
                <li th:if="${alertasRecentes == null or #lists.isEmpty(alertasRecentes)}">
                    <div class="text-center text-muted small py-3">
                        <i class="bi bi-bell-slash d-block mb-1 opacity-50"></i>
                        Sem alertas
                    </div>
                </li>
                <li th:each="a : ${alertasRecentes}">
                    <form th:action="@{/alertas/{id}/lido(id=${a.id})}" method="post">
                        <input type="hidden" name="redirect"
                               th:value="${a.link != null} ? ${a.link} : '/alertas'">
                        <button type="submit"
                                th:classappend="${!a.lido} ? 'fw-semibold bg-light'"
                                class="dropdown-item d-flex align-items-start gap-2 py-2 text-wrap border-bottom">
                            <i th:class="'bi ' + ${a.icone} + ' text-' + ${a.cor} + ' mt-1 flex-shrink-0'"></i>
                            <div class="text-start">
                                <div class="small" th:text="${a.mensagem}"></div>
                                <div class="text-muted" style="font-size:.72rem;"
                                     th:text="${#temporals.format(a.criadoEm, 'dd/MM HH:mm')}"></div>
                            </div>
                        </button>
                    </form>
                </li>
                <li th:if="${alertasNaoLidos != null and alertasNaoLidos > 0}" class="border-top">
                    <form th:action="@{/alertas/marcar-todos-lidos}" method="post">
                        <button type="submit" class="dropdown-item text-center small text-muted py-2">
                            <i class="bi bi-check2-all me-1"></i>Marcar todos como lidos
                        </button>
                    </form>
                </li>
            </ul>
        </div>

        <!-- Menu do usuário -->
        <div class="dropdown" sec:authorize="isAuthenticated()">
            <button type="button" class="ff-topbar__user" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="ff-topbar__user-avatar">
                    <span sec:authentication="name" th:text="${#strings.substring(#authentication.name, 0, 1).toUpperCase()}">U</span>
                </span>
                <span class="ff-topbar__user-name" sec:authentication="name">usuário</span>
                <i class="bi bi-chevron-down" style="font-size:.75rem;"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow">
                <li class="px-3 py-2 border-bottom">
                    <div class="fw-semibold small" sec:authentication="name"></div>
                    <div class="text-muted" style="font-size:.72rem;">
                        <span sec:authentication="authorities"></span>
                    </div>
                </li>
                <li>
                    <a class="dropdown-item small" th:href="@{/2fa/setup}">
                        <i class="bi bi-shield-lock me-2"></i>Autenticação 2FA
                    </a>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="dropdown-item small text-danger">
                            <i class="bi bi-box-arrow-right me-2"></i>Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>

    </div>
</header>

</body>
</html>
