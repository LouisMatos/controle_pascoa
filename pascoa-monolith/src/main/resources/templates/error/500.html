<!DOCTYPE html>
<!-- V9 Etapa 1.6 — autossuficiente: sem layout, sem fragments, sem ${tenant}. -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro — Controle Páscoa</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
           display: flex; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; background: #f8fafc; color: #0f172a; }
    .box { text-align: center; padding: 2rem; max-width: 480px; }
    h1 { font-size: 5rem; margin: 0; color: #dc2626; line-height: 1; }
    h2 { margin: 0.5rem 0 1rem; }
    p  { color: #64748b; margin: 0.5rem 0; }
    a  { color: #e91e63; text-decoration: none; font-weight: 600;
         display: inline-block; margin-top: 1rem; }
    a:hover { text-decoration: underline; }
    .msg { font-family: ui-monospace, "SF Mono", Menlo, monospace;
           font-size: 0.85rem; background: #fff; padding: 0.75rem;
           border-radius: 6px; border: 1px solid #e2e8f0; text-align: left;
           white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <div class="box">
    <h1>500</h1>
    <h2>Algo deu errado</h2>
    <p>Ocorreu um erro interno. Nossa equipe foi notificada.</p>
    <p th:if="${message != null and !#strings.isEmpty(message)}"
       class="msg" th:text="${message}"></p>
    <a href="/dashboard">&larr; Voltar ao início</a>
  </div>
</body>
</html>
