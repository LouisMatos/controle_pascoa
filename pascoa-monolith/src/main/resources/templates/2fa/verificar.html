<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificação 2FA — Sistema Páscoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- MO-06 — preload + carga paralela do Inter (evita FOUC). -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/foodflow.css}">
</head>
<body>

<div class="ff-auth">
    <div class="ff-auth__container">

        <div class="ff-auth__brand">
            <i class="bi bi-shield-lock-fill ff-auth__brand-icon"></i>
            <h1 class="ff-auth__brand-title">Verificação em 2 Etapas</h1>
            <p class="ff-auth__brand-subtitle">Digite o código de 6 dígitos do seu aplicativo autenticador</p>
        </div>

        <div class="ff-auth__card">

            <div th:if="${erro}" class="alert alert-danger py-2"
                 role="alert" style="font-size: var(--text-sm);" th:text="${erro}"></div>

            <form th:action="@{/2fa/verificar}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="ff-field">
                    <input type="text" name="codigo" class="ff-input ff-otp-input"
                           placeholder="000000" maxlength="6" inputmode="numeric"
                           autofocus autocomplete="one-time-code" required>
                </div>
                <button type="submit" class="ff-btn ff-btn--primary ff-btn--lg" style="width: 100%;">
                    <i class="bi bi-check-circle"></i>
                    <span>Verificar</span>
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="/logout" class="ff-btn ff-btn--link">Cancelar e voltar ao login</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
