<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pedidos — Sistema Páscoa</title>
</head>
<body>
<div id="pageContent">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-1 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-cart3" style="color: var(--brand-primary);"></i>Pedidos
        </h1>
        <div class="ff-btn-group">
            <a th:href="@{/pedidos/wizard}" class="ff-btn ff-btn--primary">
                <i class="bi bi-magic"></i>
                <span>Novo Pedido (Wizard)</span>
            </a>
            <a th:href="@{/pedidos/novo}" class="ff-btn ff-btn--secondary ff-btn--sm">
                <i class="bi bi-plus-lg"></i>
                <span>Formulário simples</span>
            </a>
            <a th:href="${statusFiltro != null}
                        ? @{/export/pedidos/excel(status=${statusFiltro.name()})}
                        : @{/export/pedidos/excel}"
               class="ff-btn ff-btn--secondary ff-btn--sm" title="Exportar para Excel">
                <i class="bi bi-file-earmark-excel" style="color: #198754;"></i>
                <span>Excel</span>
            </a>
        </div>
    </div>

    <!-- Filtro por status (pills) -->
    <div class="ff-card mb-3" style="padding: var(--space-3) var(--space-4);">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="ff-text-sm ff-text-muted fw-semibold">Filtrar:</span>
            <a th:href="@{/pedidos}"
               class="ff-btn ff-btn--sm"
               th:classappend="${statusFiltro == null} ? 'ff-btn--primary' : 'ff-btn--ghost'">Todos</a>
            <a th:each="s : ${statusValues}"
               th:href="@{/pedidos(status=${s.name()})}"
               class="ff-btn ff-btn--sm"
               th:classappend="${statusFiltro == s} ? 'ff-btn--primary' : 'ff-btn--ghost'"
               th:text="${s.descricao}"></a>
        </div>
    </div>

    <div class="ff-table-wrapper">
        <div class="ff-table-wrapper--scroll" style="overflow-x:auto;">
            <table class="ff-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Cliente</th>
                        <th>Data Pedido</th>
                        <th>Entrega</th>
                        <th class="ff-col-center">Status</th>
                        <th class="ff-col-num">Total</th>
                        <th class="ff-col-actions">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${pedidos}">
                        <td class="ff-text-muted fw-bold" th:text="'#' + ${p.id}"></td>
                        <td class="fw-semibold" th:text="${p.cliente.nome}"></td>
                        <td th:text="${#temporals.format(p.dataPedido, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <span th:if="${p.dataEntrega != null}"
                                  th:text="${#temporals.format(p.dataEntrega, 'dd/MM/yyyy')}"></span>
                            <span th:if="${p.dataEntrega == null}" class="ff-text-muted">—</span>
                        </td>
                        <td class="ff-col-center">
                            <span class="ff-badge ff-badge--bullet"
                                  th:classappend="${p.status.name() == 'NOVO'        ? 'ff-badge--novo'         :
                                                   p.status.name() == 'CONFIRMADO'   ? 'ff-badge--confirmado'   :
                                                   p.status.name() == 'EM_PRODUCAO'  ? 'ff-badge--em-producao'  :
                                                   p.status.name() == 'PRONTO'       ? 'ff-badge--pronto'       :
                                                   p.status.name() == 'ENTREGUE'     ? 'ff-badge--entregue'     :
                                                                                        'ff-badge--cancelado'}"
                                  th:text="${p.status.descricao}"></span>
                        </td>
                        <td class="ff-col-num fw-semibold">
                            R$ <span th:text="${#numbers.formatDecimal(p.totalPedido, 1, 'POINT', 2, 'COMMA')}"></span>
                        </td>
                        <td class="ff-col-actions">
                            <a th:href="@{/pedidos/{id}(id=${p.id})}"
                               class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm" title="Ver detalhes">
                                <i class="bi bi-eye"></i>
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pedidos)}" class="ff-table__empty">
                        <td colspan="7">
                            <i class="bi bi-cart3" style="font-size: 2rem; opacity: 0.4; display:block; margin-bottom: var(--space-2);"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="ff-table-footer" th:if="${!#lists.isEmpty(pedidos)}">
            <span th:text="${#lists.size(pedidos)}"></span> pedido(s).
        </div>
    </div>

</div>
</body>
</html>
