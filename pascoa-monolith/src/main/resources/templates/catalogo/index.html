<!DOCTYPE html>
<html th:replace="~{fragments/layout-public :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Catálogo — Páscoa Artesanal</title>
</head>
<body>
<div id="pageContent">

    <!-- Filtros por categoria -->
    <div class="d-flex flex-wrap gap-2 mb-4 align-items-center">
        <span class="ff-text-sm ff-text-muted fw-semibold me-1">Categoria:</span>
        <a th:href="@{/catalogo}" class="ff-btn ff-btn--sm"
           th:classappend="${categoriaAtiva == null} ? 'ff-btn--primary' : 'ff-btn--ghost'">
            <i class="bi bi-grid"></i>
            <span>Todos</span>
        </a>
        <a th:each="cat : ${categorias}"
           th:href="@{/catalogo(categoria=${cat.name()})}"
           class="ff-btn ff-btn--sm"
           th:classappend="${categoriaAtiva != null and categoriaAtiva == cat} ? 'ff-btn--primary' : 'ff-btn--ghost'"
           th:text="${cat.descricao}"></a>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(produtos)}"
         th:replace="~{fragments/empty-state :: empty(
             icon='bi-egg',
             title='Nenhum produto nessa categoria',
             description='Tente outra categoria ou veja todos os produtos.',
             actionLabel='Ver todos',
             actionHref=@{/catalogo})}">
    </div>

    <!-- Grid de produtos -->
    <div th:unless="${#lists.isEmpty(produtos)}"
         class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-3">
        <div th:each="p : ${produtos}" class="col">
            <a th:href="@{/catalogo/{id}(id=${p.id})}"
               class="ff-card ff-card--clickable h-100 text-decoration-none"
               style="padding: 0; overflow: hidden; color: inherit;">

                <!-- Foto ou placeholder -->
                <div style="width:100%; aspect-ratio: 4/3; background: var(--color-slate-100); display:flex; align-items:center; justify-content:center; overflow:hidden;">
                    <!-- M-08 — width/height + loading=lazy + decoding=async
                         para reservar espaço (zero CLS) e diferir o carregamento
                         das fotos abaixo da fold. -->
                    <img th:if="${p.foto != null and !p.foto.isEmpty()}"
                         th:src="@{/media/{f}(f=${p.foto})}"
                         th:alt="${p.nome}"
                         width="400" height="300"
                         loading="lazy" decoding="async"
                         style="width:100%; height:100%; object-fit:cover;">
                    <i th:unless="${p.foto != null and !p.foto.isEmpty()}"
                       class="bi bi-egg" style="font-size: 3rem; color: var(--color-slate-500); opacity: 0.5;"></i>
                </div>

                <div style="padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-2); height: 100%;">
                    <span class="badge text-white align-self-start"
                          th:classappend="'badge-' + ${p.categoria.name()}"
                          th:text="${p.categoria.descricao}"></span>

                    <h3 class="ff-body fw-bold mb-0" th:text="${p.nome}"></h3>

                    <p class="ff-text-sm ff-text-muted mb-0" style="flex:1;"
                       th:if="${p.descricao != null and !p.descricao.isEmpty()}"
                       th:text="${#strings.abbreviate(p.descricao, 80)}"></p>

                    <div class="d-flex justify-content-between align-items-center mt-auto pt-2">
                        <span class="fw-bold" style="font-size: var(--text-heading-3); color: var(--brand-primary);">
                            R$ <span th:text="${#numbers.formatDecimal(p.precoVenda, 1, 'POINT', 2, 'COMMA')}"></span>
                        </span>
                        <span class="ff-btn ff-btn--ghost ff-btn--sm" style="pointer-events: none;">
                            <i class="bi bi-eye"></i>
                            <span>Ver</span>
                        </span>
                    </div>
                </div>
            </a>
        </div>
    </div>

    <!-- Contador + CTA WhatsApp -->
    <div th:unless="${#lists.isEmpty(produtos)}" class="text-center mt-5">
        <p class="ff-text-sm ff-text-muted mb-3">
            <span th:text="${#lists.size(produtos)}"></span> produto(s) encontrado(s)
        </p>
        <a th:if="${tenantWhatsapp != null}"
           th:href="'https://wa.me/' + ${tenantWhatsapp}"
           class="ff-btn ff-btn--lg"
           style="background: #16a34a; color: #fff; border: none;"
           target="_blank">
            <i class="bi bi-whatsapp"></i>
            <span>Pedir no Zap</span>
        </a>
    </div>

</div>
</body>
</html>
