<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head><title>CRM — Sistema Páscoa</title></head>
<body>
<div id="pageContent">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-1 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-people-fill" style="color: var(--brand-primary);"></i>CRM — Clientes
        </h1>
    </div>

    <!-- KPIs -->
    <div class="ff-kpi-grid mb-4">

        <div class="ff-kpi">
            <div class="ff-kpi__icon"><i class="bi bi-people"></i></div>
            <div class="ff-kpi__content">
                <div class="ff-kpi__label">Total Clientes</div>
                <div class="ff-kpi__value" th:text="${totalClientes}">0</div>
            </div>
        </div>

        <div class="ff-kpi ff-kpi--warning">
            <div class="ff-kpi__icon"><i class="bi bi-star-fill"></i></div>
            <div class="ff-kpi__content">
                <div class="ff-kpi__label">VIP</div>
                <div class="ff-kpi__value" th:text="${totalVip}">0</div>
            </div>
        </div>

        <div class="ff-kpi ff-kpi--info">
            <div class="ff-kpi__icon"><i class="bi bi-person-plus"></i></div>
            <div class="ff-kpi__content">
                <div class="ff-kpi__label">Novos</div>
                <div class="ff-kpi__value" th:text="${totalNovos}">0</div>
            </div>
        </div>

        <div class="ff-kpi ff-kpi--danger">
            <div class="ff-kpi__icon"><i class="bi bi-person-dash"></i></div>
            <div class="ff-kpi__content">
                <div class="ff-kpi__label">Inativos (90+ dias)</div>
                <div class="ff-kpi__value" th:text="${totalInativos}">0</div>
            </div>
        </div>

    </div>

    <!-- Ranking -->
    <div class="ff-card" style="padding: 0;">
        <div class="ff-card__header" style="padding: var(--space-4) var(--space-5); border-bottom: 1px solid var(--color-card-border);">
            <h2 class="ff-card__title">
                <i class="bi bi-trophy me-2" style="color: var(--color-warning);"></i>Ranking por LTV (Top 20)
            </h2>
            <a th:href="@{/clientes}" class="ff-btn ff-btn--secondary ff-btn--sm">
                <i class="bi bi-people"></i>
                <span>Todos os clientes</span>
            </a>
        </div>

        <div th:if="${#lists.isEmpty(ranking)}"
             th:replace="~{fragments/empty-state :: empty(
                 icon='bi-people', title='Sem dados',
                 description='Nenhum cliente com pedidos registrado.',
                 actionLabel=null, actionHref=null)}">
        </div>

        <table th:unless="${#lists.isEmpty(ranking)}" class="ff-table">
            <thead>
                <tr>
                    <th style="width:50px">#</th>
                    <th>Cliente</th>
                    <th class="ff-col-center">Segmento</th>
                    <th class="ff-col-num">LTV</th>
                    <th class="ff-col-center">Pedidos</th>
                    <th class="ff-col-center">Pontos</th>
                    <th class="ff-col-actions">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c, i : ${ranking}">
                    <td class="ff-text-muted fw-semibold" th:text="${i.index + 1}"></td>
                    <td>
                        <div class="fw-semibold" th:text="${c.cliente().nome}"></div>
                        <div class="ff-text-xs ff-text-muted" th:text="${c.cliente().email}"></div>
                    </td>
                    <td class="ff-col-center">
                        <span class="badge"
                              th:classappend="'bg-' + ${c.segmento().badgeColor()}"
                              th:text="${c.segmento().descricao()}"></span>
                    </td>
                    <td class="ff-col-num fw-semibold" style="color: var(--color-success);">
                        R$ <span th:text="${#numbers.formatDecimal(c.ltv(), 1, 'POINT', 2, 'COMMA')}"></span>
                    </td>
                    <td class="ff-col-center" th:text="${c.totalPedidos()}"></td>
                    <td class="ff-col-center">
                        <span th:style="${c.saldoPontos() > 0} ? 'color: var(--color-success); font-weight:600;' : 'color: var(--color-text-secondary);'"
                              th:text="${c.saldoPontos()}"></span>
                    </td>
                    <td class="ff-col-actions">
                        <a th:href="@{/crm/clientes/{id}(id=${c.cliente().id})}"
                           class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm" title="Ver perfil">
                            <i class="bi bi-person-lines-fill"></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
