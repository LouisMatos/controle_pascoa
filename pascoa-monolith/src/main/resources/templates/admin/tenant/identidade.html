<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head><title>Identidade Visual — Admin Tenant</title></head>
<body>
<div id="pageContent">

    <div th:replace="~{admin/tenant/_tabs :: tabs(ativa='identidade')}"></div>

    <div class="d-flex align-items-center mb-4 gap-3">
        <i class="bi bi-palette" style="font-size: 1.5rem; color: var(--brand-primary);"></i>
        <h1 class="ff-heading-2 mb-0">Identidade Visual</h1>
    </div>

    <form th:action="@{/admin/tenant/identidade}" method="post" enctype="multipart/form-data"
          x-data="identidadeForm()" x-init="init()">

        <div class="row g-4">

            <!-- ═══ Coluna formulário ═══ -->
            <div class="col-lg-6">
                <div class="ff-card">

                    <div class="ff-field">
                        <label class="ff-label">Nome do Sistema (white-label)</label>
                        <input type="text" name="nomeApp" class="ff-input"
                               x-model="nomeApp" th:value="${nomeApp}" placeholder="Ex.: Páscoa Gestão">
                        <span class="ff-hint">Aparece no título do navegador, no rodapé do PDF e no PWA.</span>
                    </div>

                    <div class="ff-field">
                        <label class="ff-label">Logo</label>
                        <input type="file" name="logoFile" class="ff-input" accept="image/png,image/jpeg,image/webp,image/svg+xml">
                        <span class="ff-hint">PNG/JPG/SVG · mín. 200×200px · fundo transparente recomendado.</span>
                    </div>

                    <div class="ff-form-row">
                        <div class="ff-field">
                            <label class="ff-label">Cor Primária</label>
                            <div class="d-flex gap-2 align-items-center">
                                <input type="color" x-model="corPrimaria" @input="atualizarPreview()"
                                       style="width: 56px; height: 40px; border: 1px solid var(--color-card-border); border-radius: var(--radius-md); cursor: pointer; padding: 2px;">
                                <input type="text" name="corPrimaria" class="ff-input" x-model="corPrimaria"
                                       @input="atualizarPreview()" maxlength="7" placeholder="#e91e63">
                            </div>
                        </div>
                        <div class="ff-field">
                            <label class="ff-label">Cor Secundária</label>
                            <div class="d-flex gap-2 align-items-center">
                                <input type="color" x-model="corSecundaria" @input="atualizarPreview()"
                                       style="width: 56px; height: 40px; border: 1px solid var(--color-card-border); border-radius: var(--radius-md); cursor: pointer; padding: 2px;">
                                <input type="text" name="corSecundaria" class="ff-input" x-model="corSecundaria"
                                       @input="atualizarPreview()" maxlength="7" placeholder="#fce4ec">
                            </div>
                        </div>
                    </div>

                    <!-- Validador de contraste (7.6) -->
                    <div class="ff-card mt-3" style="background: var(--color-slate-50); padding: var(--space-3) var(--space-4);">
                        <div class="ff-text-xs ff-text-muted fw-semibold mb-2">CONTRASTE WCAG (texto branco × cor primária)</div>
                        <div class="d-flex align-items-center gap-3" x-show="contraste">
                            <span class="ff-badge"
                                  :class="{
                                    'ff-badge--success': contraste && contraste.nivel === 'AAA',
                                    'ff-badge--success': contraste && contraste.nivel === 'AA',
                                    'ff-badge--warning': contraste && contraste.nivel === 'AA_LARGE',
                                    'ff-badge--danger':  contraste && contraste.nivel === 'FAIL'
                                  }">
                                <span x-text="contraste ? contraste.ratio + ' : 1' : ''"></span>
                                ·
                                <span x-text="contraste ? contraste.nivel.replace('_', ' ') : ''"></span>
                            </span>
                            <span class="ff-text-sm" x-text="contraste ? contraste.mensagem : ''"></span>
                        </div>
                    </div>

                    <div class="ff-btn-group mt-4">
                        <button type="submit" class="ff-btn ff-btn--primary">
                            <i class="bi bi-check-lg"></i>
                            <span>Salvar identidade</span>
                        </button>
                        <button type="button" class="ff-btn ff-btn--secondary" @click="resetar()">
                            <i class="bi bi-arrow-counterclockwise"></i>
                            <span>Restaurar padrão</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ═══ Coluna preview ao vivo ═══ -->
            <div class="col-lg-6">
                <div class="ff-card" style="padding: 0; overflow: hidden;">
                    <div class="ff-card__header" style="padding: var(--space-4); border-bottom: 1px solid var(--color-card-border);">
                        <h2 class="ff-card__title">
                            <i class="bi bi-eye me-2"></i>Preview ao Vivo
                        </h2>
                    </div>
                    <div style="padding: 0;">

                        <!-- Mini sidebar -->
                        <div :style="`background:${corPrimaria}; color:#fff; padding:var(--space-4); display:flex; align-items:center; gap:var(--space-3);`">
                            <i class="bi bi-egg-fill" style="font-size: 1.25rem;"></i>
                            <span style="font-weight: 700;" x-text="nomeApp"></span>
                        </div>

                        <!-- Conteúdo simulado -->
                        <div style="padding: var(--space-5); background: #fff;">
                            <div style="font-size: var(--text-heading-3); font-weight: 700; margin-bottom: var(--space-3);"
                                 x-text="nomeApp"></div>
                            <button type="button" class="ff-btn"
                                    :style="`background:${corPrimaria}; color:#fff; border:none;`">
                                Botão Primary
                            </button>
                            <button type="button" class="ff-btn ms-2"
                                    :style="`background:${corSecundaria}; color:${corPrimaria}; border:1px solid ${corPrimaria};`">
                                Botão Secondary
                            </button>
                            <div class="ff-kpi mt-3">
                                <div class="ff-kpi__icon" :style="`background:${corSecundaria}; color:${corPrimaria};`">
                                    <i class="bi bi-cart3"></i>
                                </div>
                                <div class="ff-kpi__content">
                                    <div class="ff-kpi__label">Pedidos hoje</div>
                                    <div class="ff-kpi__value" :style="`color:${corPrimaria};`">42</div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </form>

<!-- Alpine.js (lazy, só nesta página) -->
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<script th:inline="javascript">
/*<![CDATA[*/
function identidadeForm() {
    return {
        nomeApp:       /*[[${nomeApp}]]*/ 'Páscoa Gestão',
        corPrimaria:   /*[[${corPrimaria}]]*/ '#e91e63',
        corSecundaria: /*[[${corSecundaria}]]*/ '#fce4ec',
        contraste: null,
        _debounce: null,
        init() {
            this.atualizarPreview();
        },
        atualizarPreview() {
            // Atualiza CSS vars do :root em tempo real para que TODO o app
            // mostre o preview (sidebar, topbar, badges, kpis...).
            document.documentElement.style.setProperty('--brand-primary',   this.corPrimaria);
            document.documentElement.style.setProperty('--brand-secondary', this.corSecundaria);
            // Validador de contraste — debounce 300ms
            clearTimeout(this._debounce);
            this._debounce = setTimeout(() => this.validarContraste(), 300);
        },
        async validarContraste() {
            try {
                const url = '/admin/tenant/identidade/contraste?fg=%23ffffff&bg='
                    + encodeURIComponent(this.corPrimaria);
                const res = await fetch(url);
                if (res.ok) this.contraste = await res.json();
            } catch (e) {
                console.warn('Validador de contraste indisponível', e);
            }
        },
        resetar() {
            this.nomeApp       = 'Páscoa Gestão';
            this.corPrimaria   = '#e91e63';
            this.corSecundaria = '#fce4ec';
            this.atualizarPreview();
        }
    };
}
/*]]>*/
</script>

</div>
</body>
</html>
