<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head><title>Fases de Produção — Admin Tenant</title></head>
<body>
<div id="pageContent">

    <div th:replace="~{admin/tenant/_tabs :: tabs(ativa='fases')}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-2 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-diagram-3" style="color: var(--brand-primary);"></i>Fases de Produção
        </h1>
        <button type="button" class="ff-btn ff-btn--primary" onclick="adicionarFase()">
            <i class="bi bi-plus-lg"></i>
            <span>Adicionar fase</span>
        </button>
    </div>

    <div class="ff-text-sm ff-text-muted mb-3">
        <i class="bi bi-info-circle me-1"></i>
        Arraste pelas alças <i class="bi bi-grip-vertical"></i> para reordenar.
        A ordem aqui define a sequência das colunas no Kanban de Produção.
    </div>

    <form th:action="@{/admin/tenant/fases/salvar}" method="post">
        <input type="hidden" name="ordemJson" id="ordemJson">

        <div class="ff-card" style="padding: var(--space-3);" id="fasesList">
            <div th:each="f : ${fases}"
                 class="d-flex align-items-center gap-3 fase-item"
                 th:data-ordem="${f.ordem}"
                 th:data-nome="${f.nome}"
                 style="padding: var(--space-3); background: var(--color-card-bg); border: 1px solid var(--color-card-border); border-radius: var(--radius-md); margin-bottom: var(--space-2);">

                <i class="bi bi-grip-vertical" style="cursor: grab; color: var(--color-text-secondary); font-size: 1.25rem;"></i>

                <div style="width: 32px; height: 32px; border-radius: var(--radius-full); flex-shrink: 0;"
                     th:style="'background: ' + ${f.cor} + '; width:32px; height:32px; border-radius:var(--radius-full); flex-shrink:0;'"></div>

                <input type="text" class="ff-input fase-nome" th:value="${f.nome}"
                       style="flex: 1; max-width: 320px;">

                <input type="color" class="fase-cor" th:value="${f.cor}"
                       style="width: 44px; height: 40px; border: 1px solid var(--color-card-border); border-radius: var(--radius-md); cursor: pointer; padding: 2px;">

                <label class="ff-check">
                    <input type="checkbox" th:checked="${f.ativa}">
                    <span>Ativa</span>
                </label>

                <button type="button" class="ff-btn ff-btn--danger ff-btn--icon ff-btn--sm"
                        onclick="this.closest('.fase-item').remove()" title="Remover">
                    <i class="bi bi-trash"></i>
                </button>
            </div>
        </div>

        <div class="ff-btn-group mt-4">
            <button type="submit" class="ff-btn ff-btn--primary" onclick="serializarOrdem()">
                <i class="bi bi-check-lg"></i>
                <span>Salvar ordem</span>
            </button>
            <a th:href="@{/admin/tenant/identidade}" class="ff-btn ff-btn--secondary">Cancelar</a>
        </div>
    </form>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
  Sortable.create(document.getElementById('fasesList'), {
    animation: 180,
    handle: '.bi-grip-vertical',
    ghostClass: 'sortable-ghost',
    chosenClass: 'sortable-chosen',
    // M-06 — touch options (iOS/Android)
    delay: 150,
    delayOnTouchOnly: true,
    touchStartThreshold: 5,
    fallbackTolerance: 5
  });

  function adicionarFase() {
    const list = document.getElementById('fasesList');
    const div = document.createElement('div');
    div.className = 'd-flex align-items-center gap-3 fase-item';
    div.style.cssText = 'padding: var(--space-3); background: var(--color-card-bg); border: 1px solid var(--color-card-border); border-radius: var(--radius-md); margin-bottom: var(--space-2);';
    div.innerHTML = `
      <i class="bi bi-grip-vertical" style="cursor: grab; color: var(--color-text-secondary); font-size: 1.25rem;"></i>
      <div style="width:32px; height:32px; border-radius:var(--radius-full); background:#94a3b8; flex-shrink:0;"></div>
      <input type="text" class="ff-input fase-nome" placeholder="Nova fase" style="flex:1; max-width:320px;">
      <input type="color" class="fase-cor" value="#94a3b8" style="width: 44px; height: 40px; border: 1px solid var(--color-card-border); border-radius: var(--radius-md); cursor: pointer; padding: 2px;">
      <label class="ff-check"><input type="checkbox" checked><span>Ativa</span></label>
      <button type="button" class="ff-btn ff-btn--danger ff-btn--icon ff-btn--sm" onclick="this.closest('.fase-item').remove()"><i class="bi bi-trash"></i></button>`;
    list.appendChild(div);
  }

  function serializarOrdem() {
    const items = Array.from(document.querySelectorAll('#fasesList .fase-item')).map((el, idx) => ({
      ordem: idx + 1,
      nome:  el.querySelector('.fase-nome').value,
      cor:   el.querySelector('.fase-cor').value,
      ativa: el.querySelector('input[type=checkbox]').checked
    }));
    document.getElementById('ordemJson').value = JSON.stringify(items);
  }
</script>

</div>
</body>
</html>
