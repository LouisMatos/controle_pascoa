<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${orcId != null ? 'Editar Orçamento' : 'Novo Orçamento'} + ' — Sistema Páscoa'">
        Orçamento — Sistema Páscoa
    </title>
</head>
<body>
<div id="pageContent">

    <div class="d-flex align-items-center mb-4">
        <a th:href="@{/orcamentos}" class="btn btn-outline-secondary btn-sm me-3" aria-label="Voltar">
            <i class="bi bi-arrow-left" aria-hidden="true"></i>
        </a>
        <h2 class="mb-0">
            <i class="bi bi-file-earmark-text me-2 text-success" aria-hidden="true"></i>
            <span th:text="${orcId != null ? 'Editar Orçamento' : 'Novo Orçamento'}"></span>
        </h2>
    </div>

    <div th:if="${erroItens}" class="alert alert-danger">
        <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i><span th:text="${erroItens}"></span>
    </div>

    <form th:action="${orcId != null ? '/orcamentos/' + orcId + '/editar' : '/orcamentos/novo'}"
          th:object="${form}" method="post" id="orcamentoForm">

        <div class="row g-4">

            <!-- Coluna esquerda: dados gerais -->
            <div class="col-lg-4">
                <div class="card h-100">
                    <div class="card-header fw-semibold">
                        <i class="bi bi-person me-2" aria-hidden="true"></i>Dados Gerais
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="clienteId">Cliente <span class="text-danger" aria-hidden="true">*</span></label>
                            <select th:field="*{clienteId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('clienteId')} ? 'is-invalid'">
                                <option value="">Selecione...</option>
                                <option th:each="c : ${clientes}"
                                        th:value="${c.id}"
                                        th:text="${c.nome}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{clienteId}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="validade">Válido até <span class="text-danger" aria-hidden="true">*</span></label>
                            <input type="date" th:field="*{validade}" class="form-control"
                                   th:classappend="${#fields.hasErrors('validade')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{validade}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="observacoes">Observações</label>
                            <textarea th:field="*{observacoes}" class="form-control" rows="4"
                                      placeholder="Condições, prazo de entrega…"></textarea>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Coluna direita: itens -->
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-header fw-semibold d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-list-ul me-2" aria-hidden="true"></i>Itens do Orçamento</span>
                        <button type="button" class="btn btn-sm btn-outline-success" id="btnAdicionarLinha">
                            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Adicionar Produto
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive"><table class="table align-middle mb-0" id="tabelaItens">
                            <thead>
                                <tr>
                                    <th scope="col" class="ps-3">Produto</th>
                                    <th scope="col" class="text-center col-w-90">Qtd</th>
                                    <th scope="col" class="text-end col-w-130">Preço Unit. (R$)</th>
                                    <th scope="col" class="text-end col-w-120">Subtotal</th>
                                    <th class="col-w-50" scope="col"></th>
                                </tr>
                            </thead>
                            <tbody id="linhasItens">
                                <!-- Itens do form (edição) -->
                                <tr th:each="item, i : *{itens}" th:id="'linha-' + ${i.index}">
                                    <td class="ps-3">
                                        <select th:name="'itens[' + ${i.index} + '].produtoId'"
                                                class="form-select form-select-sm produto-select">
                                            <option value="">Selecione...</option>
                                            <option th:each="p : ${produtos}"
                                                    th:value="${p.id}"
                                                    th:text="${p.nome}"
                                                    th:selected="${p.id == item.produtoId}"
                                                    th:attr="data-preco=${p.precoVenda}"></option>
                                        </select>
                                    </td>
                                    <td>
                                        <input type="number" min="0.001" step="any"
                                               th:name="'itens[' + ${i.index} + '].quantidade'"
                                               th:value="${@fmt.quantidade(item.quantidade).replace(',', '.')}"
                                               class="form-control form-control-sm text-center qtd-input">
                                    </td>
                                    <td>
                                        <input type="number" step="0.01" min="0"
                                               th:name="'itens[' + ${i.index} + '].precoUnitario'"
                                               th:value="${item.precoUnitario}"
                                               class="form-control form-control-sm text-end preco-input">
                                    </td>
                                    <td class="text-end pe-2 subtotal fw-semibold text-success">—</td>
                                    <td class="text-center">
                                        <button type="button" class="btn btn-sm btn-outline-danger" data-remover
                                                title="Remover item" aria-label="Remover item">
                                            <i class="bi bi-trash" aria-hidden="true"></i>
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                            <tfoot>
                                <tr class="table-light">
                                    <td colspan="3" class="text-end fw-bold pe-2">Total</td>
                                    <td class="text-end fw-bold text-success pe-2" id="totalGeral">R$ 0,00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 justify-content-end mt-4">
            <a th:href="@{/orcamentos}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-warning">
                <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Salvar Orçamento
            </button>
        </div>
    </form>

    <template id="modeloLinha">
        <tr>
            <td class="ps-3">
                <select name="itens[__IDX__].produtoId" class="form-select form-select-sm produto-select" aria-label="Produto">
                    <option value="">Selecione…</option>
                    <option th:each="p : ${produtos}" th:value="${p.id}" th:text="${p.nome}"
                            th:attr="data-preco=${p.precoVenda}"></option>
                </select>
            </td>
            <td><input type="number" min="0.001" step="any" name="itens[__IDX__].quantidade" value="1" aria-label="Quantidade"
                       class="form-control form-control-sm text-center qtd-input"></td>
            <td><input type="number" step="0.01" min="0" name="itens[__IDX__].precoUnitario" value="" aria-label="Preço unitário"
                       class="form-control form-control-sm text-end preco-input" placeholder="Preço"></td>
            <td class="text-end pe-2 subtotal fw-semibold text-success">—</td>
            <td class="text-center">
                <button type="button" class="btn btn-sm btn-outline-danger" data-remover
                        title="Remover item" aria-label="Remover item">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                </button>
            </td>
        </tr>
    </template>
    <script th:src="@{/js/orcamento-form.js}"></script>
</div>

</body>
</html>
