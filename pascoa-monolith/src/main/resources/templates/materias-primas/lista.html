<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Matérias-Primas — Sistema Páscoa</title>
</head>
<body>
<div id="pageContent">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-1 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-stack" style="color: var(--brand-primary);"></i>Matérias-Primas
        </h1>
        <a th:href="@{/materias-primas/nova}" class="ff-btn ff-btn--primary">
            <i class="bi bi-plus-lg"></i>
            <span>Nova Matéria-Prima</span>
        </a>
    </div>

    <!-- Busca -->
    <div class="ff-card mb-3" style="padding: var(--space-3) var(--space-4);">
        <form th:action="@{/materias-primas}" method="get" class="d-flex gap-2 flex-wrap">
            <div class="ff-input-group" style="flex: 1; min-width: 240px;">
                <span class="ff-input-group__addon"><i class="bi bi-search"></i></span>
                <input type="text" name="busca" class="ff-input" placeholder="Buscar por nome..." th:value="${busca}">
            </div>
            <button type="submit" class="ff-btn ff-btn--secondary">Buscar</button>
            <a th:href="@{/materias-primas}" class="ff-btn ff-btn--ghost ff-btn--icon"
               th:if="${busca != null and !#strings.isEmpty(busca)}" title="Limpar busca">
                <i class="bi bi-x-lg"></i>
            </a>
        </form>
    </div>

    <div class="ff-table-wrapper">
        <div style="overflow-x: auto;">
            <table class="ff-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th class="ff-col-center">Unidade</th>
                        <th class="ff-col-num">Qtd. Atual</th>
                        <th class="ff-col-num">Qtd. Mínima</th>
                        <th class="ff-col-num">Custo Unit.</th>
                        <th class="ff-col-center">Estoque</th>
                        <th class="ff-col-actions">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="mp : ${materiasPrimas}"
                        th:classappend="${mp.estoqueCritico} ? 'estoque-critico'">
                        <td class="fw-semibold" th:text="${mp.nome}"></td>
                        <td class="ff-col-center">
                            <span class="ff-badge ff-badge--neutral" th:text="${mp.unidade.simbolo}"></span>
                        </td>
                        <td class="ff-col-num" th:text="${#numbers.formatDecimal(mp.quantidadeAtual, 1, 'POINT', 3, 'COMMA')}"></td>
                        <td class="ff-col-num ff-text-muted" th:text="${#numbers.formatDecimal(mp.quantidadeMinima, 1, 'POINT', 3, 'COMMA')}"></td>
                        <td class="ff-col-num">
                            R$ <span th:text="${#numbers.formatDecimal(mp.custoUnitario, 1, 'POINT', 4, 'COMMA')}"></span>
                        </td>
                        <td class="ff-col-center">
                            <span th:if="${mp.estoqueCritico}" class="ff-badge ff-badge--danger ff-badge--bullet">
                                Crítico
                            </span>
                            <span th:unless="${mp.estoqueCritico}" class="ff-badge ff-badge--success ff-badge--bullet">
                                OK
                            </span>
                        </td>
                        <td class="ff-col-actions">
                            <a th:href="@{/materias-primas/{id}/editar(id=${mp.id})}"
                               class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/materias-primas/{id}/excluir(id=${mp.id})}" method="post"
                                  class="d-inline"
                                  onsubmit="return confirm('Confirma a exclusão?')">
                                <button type="submit" class="ff-btn ff-btn--danger ff-btn--icon ff-btn--sm" title="Excluir">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(materiasPrimas)}" class="ff-table__empty">
                        <td colspan="7">
                            <i class="bi bi-stack" style="font-size:2rem; opacity:0.4; display:block; margin-bottom:var(--space-2);"></i>
                            Nenhuma matéria-prima encontrada.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="ff-table-footer" th:if="${!#lists.isEmpty(materiasPrimas)}">
            <span th:text="${#lists.size(materiasPrimas)}"></span> item(ns) encontrado(s).
            <span class="ms-3 fw-semibold" style="color: var(--color-warning);"
                  th:if="${materiasPrimas.?[estoqueCritico].size() > 0}">
                <i class="bi bi-exclamation-triangle"></i>
                <span th:text="${materiasPrimas.?[estoqueCritico].size()}"></span> com estoque crítico.
            </span>
        </div>
    </div>

</div>
</body>
</html>
