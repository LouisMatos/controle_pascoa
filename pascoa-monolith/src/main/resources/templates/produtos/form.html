<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'} + ' — Sistema Páscoa'">Formulário</title>
</head>
<body>
<div id="pageContent">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-1 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-box-seam" style="color: var(--brand-primary);"></i>
            <span th:text="${produto.id == null ? 'Novo Produto' : 'Editar Produto'}"></span>
        </h1>
        <a th:href="@{/produtos}" class="ff-btn ff-btn--secondary ff-btn--sm">
            <i class="bi bi-arrow-left"></i>
            <span>Voltar</span>
        </a>
    </div>

    <div class="ff-card">
        <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post"
              enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{foto}">

            <div class="row g-3">
                <div class="col-md-8">
                    <div class="ff-field">
                        <label class="ff-label">Nome <span class="ff-label__required">*</span></label>
                        <input type="text" class="ff-input"
                               th:field="*{nome}"
                               th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                               placeholder="Nome do produto">
                        <div class="ff-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="ff-field">
                        <label class="ff-label">Categoria <span class="ff-label__required">*</span></label>
                        <select class="ff-select"
                                th:field="*{categoria}"
                                th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid'">
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categorias}"
                                    th:value="${cat.name()}"
                                    th:text="${cat.descricao}"></option>
                        </select>
                        <div class="ff-error" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                    </div>
                </div>

                <div class="col-md-12">
                    <div class="ff-field">
                        <label class="ff-label">Descrição</label>
                        <textarea class="ff-textarea" th:field="*{descricao}"
                                  rows="2" placeholder="Descrição do produto (opcional)"></textarea>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="ff-field">
                        <label class="ff-label">Preço de Venda (R$) <span class="ff-label__required">*</span></label>
                        <input type="number" class="ff-input"
                               th:field="*{precoVenda}"
                               th:classappend="${#fields.hasErrors('precoVenda')} ? 'is-invalid'"
                               min="0.01" step="0.01" placeholder="0,00">
                        <div class="ff-error" th:if="${#fields.hasErrors('precoVenda')}" th:errors="*{precoVenda}"></div>
                    </div>
                </div>

                <div class="col-md-4 d-flex align-items-end">
                    <label class="ff-check" style="margin-bottom: var(--space-4);">
                        <input type="checkbox" th:field="*{ativo}" id="ativo">
                        <span>Produto Ativo</span>
                    </label>
                </div>

                <!-- Foto do produto -->
                <div class="col-md-12">
                    <div class="ff-field">
                        <label class="ff-label">Foto do Produto</label>
                        <div class="d-flex align-items-start gap-3 flex-wrap">
                            <div th:if="${produto.foto != null and !produto.foto.isEmpty()}">
                                <img th:src="@{/media/{f}(f=${produto.foto})}"
                                     alt="Foto atual"
                                     style="width:80px;height:80px;object-fit:cover;border-radius:var(--radius-md);border:1px solid var(--color-card-border);">
                                <div class="ff-text-xs ff-text-muted text-center mt-1">Atual</div>
                            </div>
                            <div class="flex-grow-1" style="min-width: 240px;">
                                <input type="file" name="fotoFile" class="ff-input"
                                       accept="image/jpeg,image/png,image/webp">
                                <span class="ff-hint">
                                    JPEG, PNG ou WebP · máx. 5 MB.
                                    <span th:if="${produto.foto != null and !produto.foto.isEmpty()}">
                                        Deixe em branco para manter a foto atual.
                                    </span>
                                </span>
                            </div>
                        </div>
                        <div th:if="${erroFoto}" class="ff-error mt-1" th:text="${erroFoto}"></div>
                    </div>
                </div>
            </div>

            <hr style="border-color: var(--color-card-border); margin: var(--space-5) 0;">

            <div class="ff-btn-group">
                <button type="submit" class="ff-btn ff-btn--primary">
                    <i class="bi bi-check-lg"></i>
                    <span>Salvar</span>
                </button>
                <a th:href="@{/produtos}" class="ff-btn ff-btn--secondary">Cancelar</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
