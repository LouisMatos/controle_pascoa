<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produtos — Sistema Páscoa</title>
</head>
<body>
<div id="pageContent">

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <h1 class="ff-heading-1 mb-0 d-flex align-items-center gap-2">
            <i class="bi bi-box-seam" style="color: var(--brand-primary);"></i>Produtos
        </h1>
        <a th:href="@{/produtos/novo}" class="ff-btn ff-btn--primary">
            <i class="bi bi-plus-lg"></i>
            <span>Novo Produto</span>
        </a>
    </div>

    <!-- Busca -->
    <div class="ff-card mb-3" style="padding: var(--space-3) var(--space-4);">
        <form th:action="@{/produtos}" method="get" class="d-flex gap-2 flex-wrap">
            <div class="ff-input-group" style="flex: 1; min-width: 240px;">
                <span class="ff-input-group__addon"><i class="bi bi-search"></i></span>
                <input type="text" name="busca" class="ff-input" placeholder="Buscar por nome..." th:value="${busca}">
            </div>
            <button type="submit" class="ff-btn ff-btn--secondary">Buscar</button>
            <a th:href="@{/produtos}" class="ff-btn ff-btn--ghost ff-btn--icon"
               th:if="${busca != null and !#strings.isEmpty(busca)}" title="Limpar busca">
                <i class="bi bi-x-lg"></i>
            </a>
        </form>
    </div>

    <div class="ff-table-wrapper">
        <table class="ff-table">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Categoria</th>
                    <th class="ff-col-num">Preço de Venda</th>
                    <th class="ff-col-center">Status</th>
                    <th class="ff-col-actions">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${produtos}">
                    <td>
                        <div class="fw-semibold" th:text="${p.nome}"></div>
                        <div class="ff-text-xs ff-text-muted"
                             th:text="${p.descricao}"
                             th:if="${p.descricao != null and !#strings.isEmpty(p.descricao)}"></div>
                    </td>
                    <td>
                        <span class="badge text-white"
                              th:classappend="'badge-' + ${p.categoria.name()}"
                              th:text="${p.categoria.descricao}"></span>
                    </td>
                    <td class="ff-col-num fw-semibold">
                        R$ <span th:text="${#numbers.formatDecimal(p.precoVenda, 1, 'POINT', 2, 'COMMA')}"></span>
                    </td>
                    <td class="ff-col-center">
                        <span th:if="${p.ativo}" class="ff-badge ff-badge--success">Ativo</span>
                        <span th:unless="${p.ativo}" class="ff-badge ff-badge--neutral">Inativo</span>
                    </td>
                    <td class="ff-col-actions">
                        <a th:href="@{/fichas/{id}(id=${p.id})}"
                           class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm" title="Ficha Técnica">
                            <i class="bi bi-journal-text"></i>
                        </a>
                        <a th:href="@{/produtos/{id}/editar(id=${p.id})}"
                           class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/produtos/{id}/ativar(id=${p.id})}" method="post" class="d-inline">
                            <button type="submit" class="ff-btn ff-btn--ghost ff-btn--icon ff-btn--sm"
                                    th:title="${p.ativo ? 'Desativar' : 'Ativar'}">
                                <i class="bi" th:classappend="${p.ativo ? 'bi-toggle-on' : 'bi-toggle-off'}"></i>
                            </button>
                        </form>
                        <form th:action="@{/produtos/{id}/excluir(id=${p.id})}" method="post"
                              class="d-inline"
                              onsubmit="return confirm('Confirma a exclusão deste produto?')">
                            <button type="submit" class="ff-btn ff-btn--danger ff-btn--icon ff-btn--sm" title="Excluir">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(produtos)}" class="ff-table__empty">
                    <td colspan="5">
                        <i class="bi bi-box-seam" style="font-size:2rem; opacity:0.4; display:block; margin-bottom:var(--space-2);"></i>
                        Nenhum produto encontrado.
                    </td>
                </tr>
            </tbody>
        </table>
        <div class="ff-table-footer" th:if="${!#lists.isEmpty(produtos)}">
            <span th:text="${#lists.size(produtos)}"></span> produto(s) encontrado(s).
        </div>
    </div>

</div>
</body>
</html>
