<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erro — Sistema Páscoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
</head>
<body class="pagina-manutencao">
<main class="container px-3">
    <div class="card maintenance-card mx-auto" role="alert">
        <div class="card-body text-center p-5">
            <div class="text-warning maintenance-icon mb-3">
                <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
            </div>
            <h1 class="h2 fw-bold mb-2" th:text="${status == 404} ? 'Página não encontrada' : (${status == 403} ? 'Acesso negado' : 'Algo deu errado')">Algo deu errado</h1>
            <p class="text-muted mb-4" th:text="${status == 404} ? 'O endereço acessado não existe ou foi removido.' : (${status == 403} ? 'Você não tem permissão para acessar esta página.' : 'Ocorreu um erro inesperado. Tente novamente.')"></p>
            <a th:href="@{/dashboard}" class="btn btn-primary">Voltar ao início</a>
        </div>
    </div>
</main>
</body>
</html>
