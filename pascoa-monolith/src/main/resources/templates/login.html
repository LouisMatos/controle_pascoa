<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- M-10 — viewport-fit=cover libera env(safe-area-inset-*) no iPhone com notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login — Sistema Páscoa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- MO-06 — preload + carga paralela do Inter (evita FOUC perceptível). -->
    <link rel="preload" as="style"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" th:href="@{/css/foodflow.css}">
</head>
<body>

<div class="ff-auth">
    <div class="ff-auth__container">

        <div class="ff-auth__brand">
            <i class="bi bi-egg-fill ff-auth__brand-icon"></i>
            <h1 class="ff-auth__brand-title">Páscoa Gestão</h1>
            <p class="ff-auth__brand-subtitle">Sistema de Gestão de Ovos Artesanais</p>
        </div>

        <div class="ff-auth__card">

            <div th:if="${param.erro}" class="alert alert-danger d-flex align-items-center gap-2 py-2"
                 role="alert" style="font-size: var(--text-sm);">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>Usuário ou senha incorretos. Tente novamente.</span>
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center gap-2 py-2"
                 role="alert" style="font-size: var(--text-sm);">
                <i class="bi bi-check-circle-fill"></i>
                <span>Você saiu do sistema. Até logo!</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="ff-field">
                    <label for="username" class="ff-label">Login</label>
                    <div class="ff-input-group">
                        <span class="ff-input-group__addon"><i class="bi bi-person"></i></span>
                        <input type="text" id="username" name="username"
                               class="ff-input" autofocus autocomplete="username"
                               placeholder="seu.login" required>
                    </div>
                </div>

                <div class="ff-field">
                    <label for="password" class="ff-label">Senha</label>
                    <div class="ff-input-group">
                        <span class="ff-input-group__addon"><i class="bi bi-lock"></i></span>
                        <!-- F-11 — padding-right 3rem reserva espaço para o
                             ícone nativo de "auto-preenchimento de senha" do
                             Safari iOS, evitando sobreposição com qualquer
                             botão de show/hide customizado. -->
                        <input type="password" id="password" name="password"
                               class="ff-input" autocomplete="current-password"
                               placeholder="••••••••" required
                               style="padding-right: 3rem;">
                    </div>
                </div>

                <button type="submit" class="ff-btn ff-btn--primary ff-btn--lg" style="width: 100%;">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span>Entrar</span>
                </button>

                <div class="text-center mt-3">
                    <a href="/auth/forgot-password" class="ff-btn ff-btn--link">
                        <i class="bi bi-key"></i>
                        <span>Esqueceu sua senha?</span>
                    </a>
                </div>
            </form>
        </div>

        <p class="ff-auth__footer">
            © 2025 — Confeitaria Artesanal
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<!-- F-08 — Validação custom (desliga tooltips nativos). -->
<script th:src="@{/js/foodflow/form-validation.js}" defer></script>
<!-- F-06 — Proteção global contra duplo submit. -->
<script th:src="@{/js/foodflow/submit-guard.js}" defer></script>
</body>
</html>
