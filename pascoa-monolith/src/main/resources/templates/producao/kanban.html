<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pageContent})}"
      xmlns:th="http://www.thymeleaf.org">
<head><title>Kanban de Produção</title></head>
<body>
<div id="pageContent">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0"><i class="bi bi-kanban me-2 text-success" aria-hidden="true"></i>Kanban de Produção</h2>
    <div class="d-flex gap-2">
      <a th:href="@{/producao}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-list-ul me-1" aria-hidden="true"></i>Ver em lista
      </a>
    </div>
  </div>


  <div class="kanban-board">

    <!-- ============================================================
         COLUNA 1 — PENDENTE
         ============================================================ -->
    <section class="kanban-col" aria-labelledby="col-pendente">
      <h3 class="kanban-col-header" id="col-pendente">
        <span class="badge bg-secondary" th:text="${#lists.size(pendentes)}">0</span>
        <i class="bi bi-hourglass-split text-secondary" aria-hidden="true"></i>Pendente
      </h3>

      <div th:if="${#lists.isEmpty(pendentes)}" class="kanban-empty">
        <i class="bi bi-inbox d-block fs-4 mb-1" aria-hidden="true"></i>Nenhuma ordem pendente
      </div>

      <article th:each="o : ${pendentes}" class="kanban-card pendente" th:aria-label="${o.produto.nome}">
        <div class="kanban-card-title" th:text="${o.produto.nome}"></div>
        <div class="kanban-card-sub">
          <i class="bi bi-box-seam me-1" aria-hidden="true"></i><span th:text="${@fmt.quantidade(o.quantidade, o.produto.unidadeVenda)}"></span>
          <span th:if="${o.pedido != null}">
            &nbsp;·&nbsp;<i class="bi bi-cart3 me-1" aria-hidden="true"></i>
            <a th:href="@{/pedidos/{id}(id=${o.pedido.id})}"
               th:text="'Pedido #' + ${o.pedido.id}"
               class="text-decoration-none"></a>
          </span>
        </div>
        <div class="kanban-card-sub mt-1">
          <i class="bi bi-calendar3 me-1" aria-hidden="true"></i>
          <span th:text="${#temporals.format(o.dataAbertura,'dd/MM HH:mm')}"></span>
        </div>
        <div class="kanban-card-sub mt-1" th:if="${o.pedido != null and o.pedido.dataEntrega != null}">
          <i class="bi bi-truck me-1 text-warning" aria-hidden="true"></i>Entrega:
          <strong th:text="${#temporals.format(o.pedido.dataEntrega,'dd/MM/yyyy')}"></strong>
        </div>

        <div class="kanban-actions">
          <form th:action="@{/producao/{id}/iniciar-kanban(id=${o.id})}" method="post">
            <button type="submit" class="btn btn-primary btn-sm">
              <i class="bi bi-play-fill me-1" aria-hidden="true"></i>Iniciar
            </button>
          </form>
          <a th:href="@{/producao/{id}(id=${o.id})}" class="btn btn-outline-secondary btn-sm" th:title="|Ver ordem de ${o.produto.nome}|" th:aria-label="|Ver ordem de ${o.produto.nome}|">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </a>
          <form th:action="@{/producao/{id}/cancelar-kanban(id=${o.id})}" method="post" data-confirm="Cancelar esta ordem?">
            <button type="submit" class="btn btn-outline-danger btn-sm" th:title="|Cancelar ordem de ${o.produto.nome}|" th:aria-label="|Cancelar ordem de ${o.produto.nome}|">
              <i class="bi bi-x" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </article>
    </section>

    <!-- ====
         COLUNA 2 — EM ANDAMENTO
         ============================================================ -->
    <section class="kanban-col kanban-col-andamento" aria-labelledby="col-andamento">
      <h3 class="kanban-col-header" id="col-andamento">
        <span class="badge bg-primary" th:text="${#lists.size(emAndamento)}">0</span>
        <i class="bi bi-gear-fill text-primary" aria-hidden="true"></i>Em Andamento
      </h3>

      <div th:if="${#lists.isEmpty(emAndamento)}" class="kanban-empty">
        <i class="bi bi-inbox d-block fs-4 mb-1" aria-hidden="true"></i>Nenhuma ordem em andamento
      </div>

      <article th:each="o : ${emAndamento}" class="kanban-card em-andamento" th:aria-label="${o.produto.nome}">
        <div class="kanban-card-title" th:text="${o.produto.nome}"></div>
        <div class="kanban-card-sub">
          <i class="bi bi-box-seam me-1" aria-hidden="true"></i><span th:text="${@fmt.quantidade(o.quantidade, o.produto.unidadeVenda)}"></span>
          <span th:if="${o.pedido != null}">
            &nbsp;·&nbsp;<i class="bi bi-cart3 me-1" aria-hidden="true"></i>
            <a th:href="@{/pedidos/{id}(id=${o.pedido.id})}"
               th:text="'Pedido #' + ${o.pedido.id}"
               class="text-decoration-none"></a>
          </span>
        </div>
        <div class="kanban-card-sub mt-1">
          <i class="bi bi-calendar3 me-1" aria-hidden="true"></i>Iniciado:
          <span th:text="${#temporals.format(o.dataAbertura,'dd/MM HH:mm')}"></span>
        </div>
        <div class="kanban-card-sub mt-1" th:if="${o.pedido != null and o.pedido.dataEntrega != null}">
          <i class="bi bi-truck me-1 text-warning" aria-hidden="true"></i>Entrega:
          <strong th:text="${#temporals.format(o.pedido.dataEntrega,'dd/MM/yyyy')}"></strong>
        </div>

        <div class="kanban-actions">
          <form th:action="@{/producao/{id}/concluir-kanban(id=${o.id})}" method="post">
            <button type="submit" class="btn btn-success btn-sm">
              <i class="bi bi-check-lg me-1" aria-hidden="true"></i>Concluir
            </button>
          </form>
          <a th:href="@{/producao/{id}(id=${o.id})}" class="btn btn-outline-secondary btn-sm" th:title="|Ver ordem de ${o.produto.nome}|" th:aria-label="|Ver ordem de ${o.produto.nome}|">
            <i class="bi bi-eye" aria-hidden="true"></i>
          </a>
          <form th:action="@{/producao/{id}/cancelar-kanban(id=${o.id})}" method="post" data-confirm="Cancelar esta ordem?">
            <button type="submit" class="btn btn-outline-danger btn-sm" th:title="|Cancelar ordem de ${o.produto.nome}|" th:aria-label="|Cancelar ordem de ${o.produto.nome}|">
              <i class="bi bi-x" aria-hidden="true"></i>
            </button>
          </form>
        </div>
      </article>
    </section>

    <!-- ====
         COLUNA 3 — CONCLUÍDA (últimas 20)
         ============================================================ -->
    <section class="kanban-col kanban-col-concluida" aria-labelledby="col-concluida">
      <h3 class="kanban-col-header" id="col-concluida">
        <span class="badge bg-success" th:text="${#lists.size(concluidas)}">0</span>
        <i class="bi bi-check-circle-fill text-success" aria-hidden="true"></i>Concluída
        <small class="text-muted fw-normal">(últimas 20)</small>
      </h3>

      <div th:if="${#lists.isEmpty(concluidas)}" class="kanban-empty">
        <i class="bi bi-inbox d-block fs-4 mb-1" aria-hidden="true"></i>Nenhuma ordem concluída
      </div>

      <article th:each="o : ${concluidas}" class="kanban-card concluida" th:aria-label="${o.produto.nome}">
        <div class="kanban-card-title" th:text="${o.produto.nome}"></div>
        <div class="kanban-card-sub">
          <i class="bi bi-box-seam me-1" aria-hidden="true"></i><span th:text="${@fmt.quantidade(o.quantidade, o.produto.unidadeVenda)}"></span>
          <span th:if="${o.pedido != null}">
            &nbsp;·&nbsp;<i class="bi bi-cart3 me-1" aria-hidden="true"></i>
            <a th:href="@{/pedidos/{id}(id=${o.pedido.id})}"
               th:text="'Pedido #' + ${o.pedido.id}"
               class="text-decoration-none"></a>
          </span>
        </div>
        <div class="kanban-card-sub mt-1" th:if="${o.dataConclusao != null}">
          <i class="bi bi-check2 me-1 text-success" aria-hidden="true"></i>
          <span th:text="${#temporals.format(o.dataConclusao,'dd/MM HH:mm')}"></span>
        </div>
        <div class="kanban-actions">
          <a th:href="@{/producao/{id}(id=${o.id})}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-eye me-1" aria-hidden="true"></i>Ver
          </a>
        </div>
      </article>
    </section>

  </div><!-- fim kanban-board -->

</div>
</body>
</html>
