<!DOCTYPE html>
<html lang="pt-BR" th:replace="~{fragments/layout-auth :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nova senha — Páscoa Gestão</title>
</head>
<body>
<main class="auth-shell">
    <div th:replace="~{fragments/auth-brand :: brand('Definir nova senha')}"></div>

    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-1">Criar nova senha</h1>
            <p class="text-body-secondary small mb-3">
                Escolha uma senha segura com no mínimo 8 caracteres. Misture maiúsculas, números e símbolos para fortalecê-la.
            </p>

            <div th:if="${erro}" class="alert alert-danger py-2 small mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/auth/reset-password/{token}(token=${token})}"
                  method="post" id="formReset" data-loading="Salvando…">

                <div class="mb-3">
                    <label for="novaSenha" class="form-label fw-semibold">Nova senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock" aria-hidden="true"></i></span>
                        <input type="password" id="novaSenha" name="novaSenha" class="form-control"
                               minlength="8" autofocus required autocomplete="new-password" spellcheck="false">
                        <button class="btn btn-outline-secondary" type="button"
                                data-toggle-senha="novaSenha" aria-label="Mostrar senha" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="forcaWrap" class="progress mt-2 progress-4" role="progressbar"
                         aria-label="Força da senha" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div id="forcaBar" class="progress-bar bg-secondary" style="width:0%"></div>
                    </div>
                    <div id="forcaLabel" class="form-text" aria-live="polite"></div>
                </div>

                <div class="mb-4">
                    <label for="confirmarSenha" class="form-label fw-semibold">Confirmar nova senha</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock-fill" aria-hidden="true"></i></span>
                        <input type="password" id="confirmarSenha" name="confirmarSenha" class="form-control"
                               minlength="8" required autocomplete="new-password" spellcheck="false">
                        <button class="btn btn-outline-secondary" type="button"
                                data-toggle-senha="confirmarSenha" aria-label="Mostrar senha" aria-pressed="false">
                            <i class="bi bi-eye" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div id="matchMsg" class="form-text" aria-live="polite"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-2">
                    <i class="bi bi-check-lg me-2" aria-hidden="true"></i><span class="rotulo">Salvar nova senha</span>
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="auth-link small">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar para o login
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
