<!DOCTYPE html>
<html lang="pt-BR" th:replace="~{fragments/layout-auth :: layout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Recuperar senha — Páscoa Gestão</title>
</head>
<body>
<main class="auth-shell">
    <div th:replace="~{fragments/auth-brand :: brand('Recuperação de senha')}"></div>

    <div class="card auth-card">
        <div class="card-body p-4">
            <h1 class="h4 fw-bold mb-1">Esqueceu sua senha?</h1>
            <p class="text-body-secondary small mb-3">
                Informe seu login ou e-mail cadastrado. Se encontrarmos sua conta,
                enviaremos um link de redefinição válido por 30 minutos.
            </p>

            <div th:if="${sucesso}" class="alert alert-success py-2 small mb-3" role="status">
                <i class="bi bi-check-circle-fill me-1" aria-hidden="true"></i>
                <span th:text="${sucesso}"></span>
            </div>
            <div th:if="${erro}" class="alert alert-danger py-2 small mb-3" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1" aria-hidden="true"></i>
                <span th:text="${erro}"></span>
            </div>

            <form th:action="@{/auth/forgot-password}" method="post" data-loading="Enviando…">
                <div class="mb-3">
                    <label for="loginOuEmail" class="form-label fw-semibold">Login ou e-mail</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person" aria-hidden="true"></i></span>
                        <input type="text" id="loginOuEmail" name="loginOuEmail" class="form-control"
                               autofocus autocomplete="username" autocapitalize="none" spellcheck="false" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2">
                    <i class="bi bi-envelope me-2" aria-hidden="true"></i><span class="rotulo">Enviar link de redefinição</span>
                </button>
            </form>

            <div class="text-center mt-3">
                <a th:href="@{/login}" class="auth-link small">
                    <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>Voltar para o login
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
