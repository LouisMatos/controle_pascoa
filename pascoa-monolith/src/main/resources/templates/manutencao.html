<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema em Manutenção</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/publico.css}">
</head>
<body class="pagina-manutencao">

<div class="container px-3">
    <div class="card maintenance-card mx-auto" role="status">
        <div class="card-body text-center p-5">

            <div class="text-warning maintenance-icon mb-3">
                <i class="bi bi-tools" aria-hidden="true"></i>
            </div>

            <h1 class="h2 fw-bold mb-2">Sistema em Manutenção</h1>

            <p class="text-muted mb-3"
               th:text="${mensagem} ?: 'O sistema está temporariamente indisponível para manutenção.'">
                O sistema está temporariamente indisponível para manutenção.
            </p>

            <div th:if="${previsaoRetorno != null and !#strings.isEmpty(previsaoRetorno)}"
                 class="alert alert-info d-inline-flex align-items-center gap-2 px-4 py-2 rounded-pill mb-3">
                <i class="bi bi-clock me-1" aria-hidden="true"></i>
                <span>Previsão de retorno: <strong th:text="${previsaoRetorno}"></strong></span>
            </div>

            <hr class="my-4">

            <p class="small text-muted mb-3">
                Se você é administrador do sistema, faça login para continuar com acesso completo.
            </p>

            <a href="/login" class="btn btn-success">
                <i class="bi bi-box-arrow-in-right me-1" aria-hidden="true"></i>Entrar como Admin
            </a>
        </div>
        <div class="card-footer text-center text-muted small py-3 rounded-bottom card-footer-claro">
            <i class="bi bi-egg-fill me-1 text-success" aria-hidden="true"></i>Sistema Controle Páscoa
        </div>
    </div>
</div>

</body>
</html>
