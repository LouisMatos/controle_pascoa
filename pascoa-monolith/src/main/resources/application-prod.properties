# Perfil sandbox/trial na AWS. Ativado por SPRING_PROFILES_ACTIVE=prod.
# Sobrepõe apenas o que o application.properties deixa em modo desenvolvimento.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.thymeleaf.cache=true

# Atrás do API Gateway (HTTPS) o Tomcat vê https via X-Forwarded-Proto.
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=30m

# Devtools nunca deve subir em servidor.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

app.admin.senha-inicial=${ADMIN_SENHA_INICIAL:admin123}

logging.level.root=INFO
logging.level.br.com.seuprojeto.pascoa=INFO
logging.level.org.hibernate.SQL=WARN

app.gateway.shared-secret=${APP_GATEWAY_SHARED_SECRET:}

# Probe de infra: só o que impede a aplicação de servir. O indicador de mail depende de
# SMTP (não configurado no sandbox) e o "whatsapp" retorna UNKNOWN sem canal no banco —
# ambos derrubariam /actuator/health e o healthcheck do container.
management.health.mail.enabled=false
management.endpoint.health.group.readiness.include=db,ping
management.endpoint.health.group.readiness.show-details=never
