server:
  port: 8090

spring:
  application:
    name: pascoa-api-gateway

  # Redis usado pelo RequestRateLimiter (token-bucket por tenant — Etapa 12).
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:pascoa123}

  cloud:
    gateway:
      # X-Forwarded-* habilitado explicitamente — o monólito (Tomcat) depende disso
      # para que sendRedirect() use o host:porta do gateway (8090) e não do backend (8080).
      x-forwarded:
        enabled: true
        for-enabled: true
        host-enabled: true
        port-enabled: true
        proto-enabled: true
        prefix-enabled: true

      # Descobre serviços automaticamente via Eureka (lb://nome-do-servico)
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        # ── v6 FoodFlow — rotas explícitas ANTES do catch-all do monólito ────
        - id: tenant-service
          uri: http://localhost:8094
          predicates:
            - Path=/tenants/**,/onboarding/**,/onboarding.html,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
        - id: config-engine
          uri: http://localhost:8091
          predicates:
            - Path=/config/**
        - id: pricing-engine
          uri: http://localhost:8092
          predicates:
            - Path=/pricing/**
        - id: subscription
          uri: http://localhost:8093
          predicates:
            - Path=/subscriptions/**,/webhooks/stripe
        - id: notification-templates
          uri: http://localhost:8088
          predicates:
            - Path=/templates/**
        # auth-service — usado pela tela de login moderna servida pelo próprio gateway.
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        # Tela de login moderna servida localmente pelo gateway (LoginPageController).
        # Usa forward:// para invocar o DispatcherHandler local, sem proxy.
        - id: gateway-login
          uri: forward:/login.html
          predicates:
            - Path=/login.html

        # ── Monólito — rota catch-all (deve ser a última) ─────────────────────
        - id: pascoa-monolith
          uri: http://localhost:8080
          predicates:
            - Path=/**
          filters:
            - name: CircuitBreaker
              args:
                name: monolithCircuitBreaker
                fallbackUri: forward:/fallback/monolith
            - name: Retry
              args:
                retries: 2
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms

      # Configurações globais de timeout
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

      # Headers padrão em todas as respostas + rate limit por tenant
      default-filters:
        - AddResponseHeader=X-Gateway, pascoa-api-gateway
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        # S-04 — headers HTTP de segurança aplicados a TODOS os microsserviços v6 atrás
        # do gateway (tenant, config-engine, pricing-engine, subscription). Os serviços
        # v5 e o monólito já configuram esses headers no Spring Security; aqui o gateway
        # garante baseline também para os v6 que ainda não tinham.
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=Referrer-Policy, strict-origin-when-cross-origin
        - AddResponseHeader=Permissions-Policy, camera=(), microphone=(), geolocation=()
        - AddResponseHeader=X-XSS-Protection, 0
        - DedupeResponseHeader=X-Frame-Options X-Content-Type-Options Referrer-Policy Permissions-Policy X-XSS-Protection
        # v6 Etapa 12 — token-bucket no Redis, chave = X-Tenant-Id (anonymous quando ausente).
        # 20 req/s sustentado, burst de 40 (capacidade), expira em 60s para liberar bucket.
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${FOODFLOW_RATE_PER_SEC:20}
            redis-rate-limiter.burstCapacity: ${FOODFLOW_RATE_BURST:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@tenantKeyResolver}"

# Eureka — registra o gateway como serviço
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    # Tenta Eureka mas não bloqueia a inicialização se estiver indisponível
    enabled: ${EUREKA_ENABLED:false}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# Actuator — expõe health, info e rotas configuradas
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

# v6 Etapa 12 — Tenant resolution
foodflow:
  tenant:
    # Sufixo dos subdomínios SaaS — ex: confeitaria-maria.foodflow.com.br
    base-domain: ${FOODFLOW_BASE_DOMAIN:foodflow.com.br}
    # Paths que NÃO sofrem resolução de tenant nem rate limit (admin/infra)
    bypass-paths: /actuator/**,/webhooks/**,/fallback/**,/onboarding/**,/onboarding.html,/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html,/login.html,/api/auth/**

logging:
  level:
    org.springframework.cloud.gateway: INFO
    br.com.seuprojeto.pascoa.gateway: DEBUG
