# =============================================================================
# SonarCloud — Sistema Controle Páscoa
# Configurar em GitHub: Settings → Variables (Repository Variables):
#   SONAR_PROJECT_KEY  = LouisMatos_controle-pascoa
#   SONAR_ORGANIZATION = louismatos  (ou seu org no SonarCloud)
# E em Secrets:
#   SONAR_TOKEN = <token gerado em sonarcloud.io>
# =============================================================================

sonar.projectName=Sistema Controle Páscoa
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Linguagem principal
sonar.language=java
sonar.java.source=21

# Fontes e testes (multi-module — SonarCloud resolve automaticamente via Maven)
sonar.sources=src/main/java
sonar.tests=src/test/java

# Relatórios de cobertura JaCoCo (todos os módulos)
sonar.coverage.jacoco.xmlReportPaths=\
  pascoa-monolith/target/site/jacoco/jacoco.xml,\
  pascoa-auth-service/target/site/jacoco/jacoco.xml,\
  pascoa-customer-service/target/site/jacoco/jacoco.xml,\
  pascoa-inventory-service/target/site/jacoco/jacoco.xml,\
  pascoa-product-service/target/site/jacoco/jacoco.xml,\
  pascoa-order-service/target/site/jacoco/jacoco.xml,\
  pascoa-production-service/target/site/jacoco/jacoco.xml,\
  pascoa-financial-service/target/site/jacoco/jacoco.xml,\
  pascoa-notification-service/target/site/jacoco/jacoco.xml,\
  pascoa-analytics-service/target/site/jacoco/jacoco.xml,\
  pascoa-api-gateway/target/site/jacoco/jacoco.xml,\
  pascoa-commons/target/site/jacoco/jacoco.xml

# Exclusões — não analisar geração de código, configs e templates
sonar.exclusions=\
  **/target/**,\
  **/*.xml,\
  **/*.yml,\
  **/*.yaml,\
  **/*.html,\
  **/*.properties,\
  **/*.sql,\
  **/dto/**/*Form.java,\
  **/*Application.java,\
  **/config/**

# Exclusões de cobertura — DTOs, entities e configs não precisam de cobertura
sonar.coverage.exclusions=\
  **/dto/**,\
  **/entity/**,\
  **/config/**,\
  **/*Application.java,\
  **/*Config.java

# Duplicações — ignorar templates Thymeleaf e migrations
sonar.cpd.exclusions=\
  **/db/migration/**,\
  **/templates/**
