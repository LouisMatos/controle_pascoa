name: CI — Hotfix

# Pipeline para hotfix/* branches (correções críticas em produção).
# Após todos os jobs passarem, abre PRs automaticamente para main E develop.
#
# Convenção: hotfix/v1.2.1 ou hotfix/descricao-do-bug
# Fluxo: lint → unit-tests ─┬─ security
#                            └─ build → auto-pr-main + auto-pr-develop

on:
  push:
    branches:
      - 'hotfix/**'

concurrency:
  group: ci-hotfix-${{ github.ref }}
  cancel-in-progress: false  # nunca cancelar hotfix

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1g -XX:+UseG1GC -Dfile.encoding=UTF-8'

jobs:

  # ─── Job 1: Lint ─────────────────────────────────────────────────────────────
  lint:
    name: "Lint & Análise Estática"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Checkstyle
        run: |
          mvn checkstyle:check -Pci --no-transfer-progress \
            -Dcheckstyle.failsOnError=false \
            -Dcheckstyle.logViolationsToConsole=true

      - name: SpotBugs
        run: mvn spotbugs:check -Pci --no-transfer-progress -DfailOnError=false

  # ─── Job 2: Testes Unitários ─────────────────────────────────────────────────
  unit-tests:
    name: "Testes Unitários"
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Executar testes (exclui IT)
        run: |
          mvn test --no-transfer-progress \
            -Dsurefire.excludes="**/*IT.java,**/*IntegrationTest.java,**/*IT.class,**/*IntegrationTest.class"

      - name: Publicar resultado
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Hotfix Testes — ${{ github.ref_name }}"
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

  # ─── Job 3: Segurança (crítico para hotfix) ───────────────────────────────────
  security:
    name: "Análise de Segurança"
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache NVD (OWASP)
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check
          key: owasp-nvd-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:10.0.4:aggregate \
            --no-transfer-progress \
            -DsuppressionsFile=.github/owasp-suppressions.xml \
            -DfailBuildOnCVSS=9 \
            -DautoUpdate=true \
            -Dformat=HTML \
            -DdataDirectory=$HOME/.owasp/dependency-check \
            -DskipTestScope=true || true

      - name: Upload OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-hotfix-${{ github.run_id }}
          path: 'target/dependency-check-report.html'
          retention-days: 30
          if-no-files-found: ignore

      - name: Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload Trivy → Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─── Job 4: Build ────────────────────────────────────────────────────────────
  build:
    name: "Build & Package"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: hotfix-artifacts-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/dependency/**
            !**/target/original-*.jar
          retention-days: 7
          if-no-files-found: warn

  # ─── Job 5: Auto-PR → main ───────────────────────────────────────────────────
  auto-pr-to-main:
    name: "Auto-PR → main"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Criar PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          HOTFIX_NAME=$(echo "$BRANCH" | sed 's|hotfix/||')

          PR_NUMBER=$(gh pr list \
            --base main \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            PR_BODY=$(printf '## Hotfix: %s\n\nCI passou - Correcao critica validada.\n\n### Impacto\nDescrever qual bug e corrigido e o impacto em producao.\n\n### Checklist\n- [ ] Bug reproduzido e confirmado\n- [ ] Fix aplicado e testado localmente\n- [ ] Regression test adicionado\n- [ ] Este PR sera backportado para develop tambem\n\n---\nAuto-gerado pelo pipeline ci-hotfix.yml.' "${HOTFIX_NAME}")
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "hotfix: $HOTFIX_NAME" \
              --body "$PR_BODY" \
              --label "hotfix,urgent"
            echo "PR criado: $BRANCH -> main"
          else
            echo "PR #$PR_NUMBER ja existe para $BRANCH -> main"
          fi

  # ─── Job 6: Auto-PR → develop (backport) ─────────────────────────────────────
  auto-pr-to-develop:
    name: "Auto-PR → develop (backport)"
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Criar PR de backport para develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ github.ref_name }}"
          HOTFIX_NAME=$(echo "$BRANCH" | sed 's|hotfix/||')

          PR_NUMBER=$(gh pr list \
            --base develop \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -z "$PR_NUMBER" ]; then
            PR_BODY=$(printf '## Backport: %s -> develop\n\nBackport obrigatorio do hotfix para garantir que develop nao regrida.\n\nPR principal (-> main): veja PRs com label hotfix.\n\n---\nAuto-gerado pelo pipeline ci-hotfix.yml.' "${HOTFIX_NAME}")
            gh pr create \
              --base develop \
              --head "$BRANCH" \
              --title "hotfix(backport): $HOTFIX_NAME -> develop" \
              --body "$PR_BODY" \
              --label "hotfix,backport"
            echo "PR de backport criado: $BRANCH -> develop"
          else
            echo "PR #$PR_NUMBER ja existe para $BRANCH -> develop (backport)"
          fi
