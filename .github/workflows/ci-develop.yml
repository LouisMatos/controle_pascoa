name: CI — Develop (Full)

# Pipeline completo para a branch develop.
# Dispara em: push direto ao develop (merge de feat/fix) e PRs de release/* ou hotfix/*.
# Fluxo: lint → unit-tests ─┬─ security
#                            └─ sonar (aguarda cobertura)
#                                     └─ build (aguarda testes + segurança)
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-develop-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx1g -XX:+UseG1GC -Dfile.encoding=UTF-8'

jobs:

  # ─── Job 1: Lint & Análise Estática ─────────────────────────────────────────
  lint:
    name: "Lint & Análise Estática"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Checkstyle
        run: |
          mvn checkstyle:check -Pci --no-transfer-progress \
            -Dcheckstyle.failsOnError=false \
            -Dcheckstyle.logViolationsToConsole=true

      - name: SpotBugs
        run: mvn spotbugs:check -Pci --no-transfer-progress -DfailOnError=false

      - name: Upload SpotBugs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-develop-${{ github.run_id }}
          path: '**/target/spotbugsXml.xml'
          retention-days: 7
          if-no-files-found: ignore

  # ─── Job 2: Testes Unitários ─────────────────────────────────────────────────
  unit-tests:
    name: "Testes Unitários"
    runs-on: ubuntu-latest
    needs: [lint]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Executar testes (exclui IT)
        run: |
          mvn test --no-transfer-progress \
            -Dsurefire.excludes="**/*IT.java,**/*IntegrationTest.java,**/*IT.class,**/*IntegrationTest.class"

      - name: Publicar resultado dos testes
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Testes Unitários JUnit — develop
          path: '**/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: false

      - name: Upload Surefire
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-develop-${{ github.run_id }}
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload cobertura JaCoCo
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-develop-${{ github.run_id }}
          path: '**/target/site/jacoco/jacoco.xml'
          retention-days: 7
          if-no-files-found: ignore

  # ─── Job 3: Segurança (paralelo com sonar) ───────────────────────────────────
  security:
    name: "Análise de Segurança"
    runs-on: ubuntu-latest
    needs: [lint]
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Cache NVD (OWASP)
        uses: actions/cache@v4
        with:
          path: ~/.owasp/dependency-check
          key: owasp-nvd-${{ hashFiles('**/pom.xml') }}
          restore-keys: owasp-nvd-

      - name: OWASP Dependency Check
        run: |
          mvn org.owasp:dependency-check-maven:10.0.4:aggregate \
            --no-transfer-progress \
            -DsuppressionsFile=.github/owasp-suppressions.xml \
            -DfailBuildOnCVSS=9 \
            -DautoUpdate=true \
            -Dformat=HTML \
            -DdataDirectory=$HOME/.owasp/dependency-check \
            -DskipTestScope=true || true

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-develop-${{ github.run_id }}
          path: 'target/dependency-check-report.html'
          retention-days: 14
          if-no-files-found: ignore

      - name: Trivy — varredura filesystem
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: 'CRITICAL,HIGH'
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true

      - name: Upload Trivy → Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ─── Job 4: SonarCloud ───────────────────────────────────────────────────────
  sonar:
    name: "SonarCloud"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Download JaCoCo
        uses: actions/download-artifact@v4
        with:
          name: jacoco-develop-${{ github.run_id }}
          path: jacoco-coverage
        continue-on-error: true

      - name: SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar --no-transfer-progress \
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths='**/target/site/jacoco/jacoco.xml' \
            -Dsonar.exclusions='**/target/**,**/*.xml,**/*.yml,**/dto/**' \
            -Dsonar.java.source=21

  # ─── Job 5: Build Final ───────────────────────────────────────────────────────
  build:
    name: "Build & Package"
    runs-on: ubuntu-latest
    needs: [unit-tests, security]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build — gerar JARs
        run: mvn package -DskipTests --no-transfer-progress

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: build-develop-${{ github.sha }}
          path: |
            **/target/*.jar
            !**/target/*-sources.jar
            !**/target/dependency/**
            !**/target/original-*.jar
          retention-days: 3
          if-no-files-found: warn
