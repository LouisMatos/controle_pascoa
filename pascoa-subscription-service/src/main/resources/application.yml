server:
  port: 8093
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 200

spring:
  application:
    name: pascoa-subscription-service
  datasource:
    url: jdbc:postgresql://localhost:5441/foodflow_platform
    username: postgres
    password: sua_senha
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: subscription
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: subscription
    schemas: subscription
    create-schemas: false

# Modo MOCK por default — habilite em prod com chave Stripe e price IDs reais.
stripe:
  enabled: ${STRIPE_ENABLED:false}
  api-key: ${STRIPE_API_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price:
    starter:    ${STRIPE_PRICE_STARTER:}
    pro:        ${STRIPE_PRICE_PRO:}
    enterprise: ${STRIPE_PRICE_ENTERPRISE:}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: ${EUREKA_ENABLED:false}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
