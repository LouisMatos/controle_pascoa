

# =============================================================================
# Infraestrutura base — Sistema Páscoa v5 (Strangler Fig)
# Serviços: PostgreSQL x9, RabbitMQ, Redis, Zipkin
# Serviços Spring Cloud (Eureka, Config) rodam via Maven fora do compose
#
# Recursos totais reservados neste compose (dev):
#   RAM: ~1.5 GB   |   CPU: 1.5 cores
#   Sobram ~2.3 GB no Docker VM para Spring Boot rodando no host
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — uma instância, múltiplos bancos (init script)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sua_senha
      POSTGRES_DB: pascoa_monolith
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.50"
        reservations:
          memory: 256M

  # ---------------------------------------------------------------------------
  # RabbitMQ — mensageria assíncrona entre microsserviços
  # Management UI: http://localhost:15672  (pascoa/pascoa123)
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    platform: linux/arm64
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: pascoa
      RABBITMQ_DEFAULT_PASS: pascoa123
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.50"
        reservations:
          memory: 128M

  # ---------------------------------------------------------------------------
  # Redis — cache + JWT blacklist + rate limiting
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: unless-stopped
    command: redis-server --requirepass pascoa123 --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pascoa123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: "0.25"
        reservations:
          memory: 64M

  # ---------------------------------------------------------------------------
  # Zipkin — distributed tracing (retenção de 24h, sem auto-rastreamento)
  # UI: http://localhost:9411
  # ---------------------------------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:3
    platform: linux/arm64
    restart: unless-stopped
    environment:
      STORAGE_TYPE: mem
      QUERY_LOOKBACK: 86400000        # retém traces das últimas 24h
      ZIPKIN_SELF_TRACING_ENABLED: "false"
    ports:
      - "9411:9411"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9411/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  rabbitmq_data:
    driver: local
  redis_data:
    driver: local

# =============================================================================
# Portas reservadas (serviços Spring Cloud — rodam via Maven/IntelliJ):
#   8761 — Eureka Server       (pascoa-eureka)
#   8888 — Config Server       (pascoa-config-server)
#   8080 — Monólito atual      (pascoa-monolith)
#   8090 — API Gateway         (pascoa-api-gateway)
# =============================================================================
