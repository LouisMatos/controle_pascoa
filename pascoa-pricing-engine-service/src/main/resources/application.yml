server:
  port: 8092
  tomcat:
    threads:
      max: 20
      min-spare: 2
    max-connections: 200

spring:
  application:
    name: pascoa-pricing-engine-service
  datasource:
    url: jdbc:postgresql://localhost:5441/foodflow_platform
    username: postgres
    password: sua_senha
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 60000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pricing
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: pricing
    schemas: pricing
    create-schemas: false   # schema 'pricing' já criado por init-platform.sql

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    enabled: ${EUREKA_ENABLED:false}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
